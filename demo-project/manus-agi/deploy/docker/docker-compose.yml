version: '3.8'

services:
  orimind:
    build: .
    ports:
      - "3000:3000"
      - "3002:3002"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - CONTAINER_MODE=true
    volumes:
      - orimind-logs:/app/logs
      - orimind-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  orimind-monitor:
    build: .
    command: ["node", "health-checker.js"]
    depends_on:
      - orimind
    volumes:
      - orimind-logs:/app/logs
    restart: unless-stopped

volumes:
  orimind-logs:
  orimind-data:
